<!DOCTYPE html>
<html>
<head>
    <title>BFHL API Tester</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }
        .box {
            background: white;
            padding: 25px;
            width: 420px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        pre {
            background: #111;
            color: #00ffcc;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
<div class="box">
    <h2>BFHL API Tester</h2>

    <textarea id="jsonInput" rows="6">
{ "fibonacci": 5 }
    </textarea>

    <button onclick="send()">Send Request</button>

    <pre id="output"></pre>
</div>

<script>
function send() {

    fetch("/bfhl", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: document.getElementById("jsonInput").value
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("output").innerText =
            JSON.stringify(data, null, 2);
    });
}
</script>

</body>
</html>
